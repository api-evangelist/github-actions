name: GitHub Actions
x-parent: github
description: >-
  GitHub Actions is GitHub's hosted CI/CD and workflow automation platform, and
  this record covers the REST API surface that drives it. Eighty-two operations
  across eleven resource areas let a caller dispatch and cancel workflow runs,
  poll runs and jobs, read and prune logs, artifacts and caches, seal and rotate
  encrypted secrets and variables, set Actions permissions and default workflow
  token scopes, customize the OIDC subject claim used for cloud federation, and
  register, label and retire self-hosted runners and runner groups. The API is
  authenticated with bearer tokens (fine-grained or classic PATs, OAuth user
  tokens, GitHub App installation tokens, or the workflow's own GITHUB_TOKEN),
  versioned by a dated X-GitHub-Api-Version header, rate limited per hour by
  authentication method, and paired with a nine-event webhook surface that
  carries the run and job lifecycle plus the deployment approval callback.
deliveryModel:
