mcp_only:
  - tool: get_job_logs
    reason: >-
      failed_only / tail_lines / return_content have no REST equivalent — the
      REST API returns a redirect to a full log archive, not filtered or
      tailed content.
rest_only:
  - operations: [listJobsForWorkflowRunAttempt, getWorkflowRunAttempt, downloadWorkflowRunAttemptLogs]
    reason: per-attempt run inspection has no tool
  - operations: [rerunJobForWorkflowRun]
    reason: >-
      re-running a SINGLE job is REST-only; actions_run_trigger re-runs a whole
      run or all of its failed jobs, never one named job
  - operations: [approveWorkflowRun, getWorkflowRunApprovals, getPendingDeployments, reviewPendingDeployments, reviewCustomGatesForRun, forceCancelWorkflowRun, deleteWorkflowRun]
    reason: >-
