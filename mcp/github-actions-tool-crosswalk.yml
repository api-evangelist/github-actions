method: derived
source: >-
  MCP tool + method surface read from github/github-mcp-server (README.md and
  pkg/github/actions.go, main branch, release v1.12.2 2026-09-16); REST
  operationIds read from this repo's openapi/*.yml. The live tools/list
  endpoint is auth-gated (401), so the tool set was read from the server's own
  source rather than from an authenticated introspection.
description: >-
  Binds every tool in the GitHub MCP server's `actions` toolset to the GitHub
  Actions REST operations that back it, and records what each surface can do
  that the other cannot. The headline finding: the MCP server consolidates 82
  REST operations into FOUR tools with a `method` discriminator — 15 method
  values in total — so 67 of the 82 REST operations have no MCP tool at all.
  Everything the Secrets, Variables, Permissions, OIDC, Runner and Runner-Group
  APIs do is REST-only; an agent on MCP can watch and drive workflow runs but
  cannot manage the configuration that runs them.
surfaces:
  openapi:
    files: openapi/*.yml
    operations: 82
    base: https://api.github.com
    gated: false
  mcp:
    url: https://api.githubcopilot.com/mcp/
    toolset: actions
    tools: 4
    methods: 15
    gated: true
    gate: 'tools/list returns 401 without an Authorization header; OAuth or PAT required'
  graphql:
    url: https://api.github.com/graphql
    note: >-
      GitHub's GraphQL API does not expose the Actions administration surface
      (workflows, runs, jobs, secrets, runners); it is not a projection of
      these operations and is out of scope for this crosswalk.
