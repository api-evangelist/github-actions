  - operations: [getGithubActionsPermissionsRepo, setGithubActionsPermissionsRepo, getGithubActionsDefaultWorkflowPermissionsRepo, setGithubActionsDefaultWorkflowPermissionsRepo, getGithubActionsPermissionsOrg, setGithubActionsPermissionsOrg]
