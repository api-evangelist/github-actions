source: >-
  https://docs.github.com/en/rest/about-the-rest-api/libraries-for-the-rest-api
  plus live registry metadata reads on 2026-09-17 —
  registry.npmjs.org, rubygems.org/api/v1, api.nuget.org/v3,
  proxy.golang.org, pypi.org/pypi and the GitHub releases API.
description: >-
  First-party GitHub client libraries (the Octokit family) plus the official
  GitHub CLI, all of which cover the Actions REST API surface. Versions and
  publication dates below were read from each registry's own metadata endpoint,
  not from the docs. GitHub ships no first-party Python SDK; PyGithub is the
  widely used community library and is marked official: false.
currency_finding: >-
  The three SDKs GitHub itself maintains have all gone quiet while the API they
  wrap keeps shipping. octokit (npm) and @octokit/rest last published
  2025-10-31, ten and a half months ago; octokit.rb last shipped 2025-04-24,
  nearly seventeen months ago; Octokit .NET last shipped 2025-01-08, over
  twenty months ago. Over the same window go-github — maintained by Google, not
  GitHub — released majors v74 through v92, the latest on 2026-09-14, and the
  GitHub CLI shipped v2.101.0 on 2026-09-15. So the gap is not GitHub-wide
  neglect; it is specific to the Octokit SDK family, and it is the strongest
  decay signal available on this provider because it is provider-published and
  reliably dated.
