generated: '2026-06-20'
method: searched
source: https://cli.github.com/manual/
description: >-
  The GitHub CLI (gh) command surface for GitHub Actions. gh is the official
  first-party CLI; its binary is catalogued in packages/github-actions-packages.yml.
  These command groups map onto the Actions REST operations in
  openapi/github-actions-openapi.yml (workflows, runs, caches, secrets, variables).
docs: https://cli.github.com/manual/
repo: https://github.com/cli/cli
install:
  homebrew: brew install gh
  winget: winget install --id GitHub.cli
  apt: 'see https://github.com/cli/cli/blob/trunk/docs/install_linux.md'
  scoop: scoop install gh
auth:
  - {name: gh auth login, description: Authenticate the CLI with a GitHub host (interactive or token).}
  - {name: gh auth token, description: Print the active authentication token (usable as a REST bearer token).}
commands:
  workflows:
    - {name: gh workflow list, description: List the workflows in a repository.}
    - {name: gh workflow view, description: View a workflow, its recent runs and usage.}
    - {name: gh workflow run, description: Trigger a workflow_dispatch run, optionally with inputs.}
    - {name: gh workflow enable, description: Enable a workflow.}
    - {name: gh workflow disable, description: Disable a workflow.}
  runs:
    - {name: gh run list, description: List recent workflow runs.}
    - {name: gh run view, description: View a run, its jobs, and step logs.}
    - {name: gh run watch, description: Watch a run until it completes.}
    - {name: gh run rerun, description: Re-run a failed or entire workflow run.}
    - {name: gh run cancel, description: Cancel a workflow run.}
    - {name: gh run delete, description: Delete a workflow run.}
    - {name: gh run download, description: Download artifacts generated by a run.}
  caches:
    - {name: gh cache list, description: List Actions caches for a repository.}
    - {name: gh cache delete, description: Delete one or more Actions caches.}
  secrets:
    - {name: gh secret list, description: List secrets at repo, environment, or org scope.}
    - {name: gh secret set, description: Create or update an encrypted secret.}
    - {name: gh secret delete, description: Delete a secret.}
  variables:
    - {name: gh variable list, description: List Actions variables at repo, environment, or org scope.}
    - {name: gh variable set, description: Create or update an Actions variable.}
    - {name: gh variable delete, description: Delete an Actions variable.}
  api:
    - {name: gh api, description: Make an authenticated call to any REST or GraphQL endpoint, incl. the Actions API, with pagination and jq support.}
