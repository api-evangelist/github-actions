description: >-
  Probe of the /.well-known/ discovery surface for the GitHub Actions API host
  (api.github.com), the docs host (docs.github.com), the primary web domain
  (github.com) and the GitHub MCP server host (api.githubcopilot.com, named by
  mcp/github-actions-mcp.yml). Three real documents are served. github.com
  publishes an RFC 9116 security.txt. The MCP host publishes an RFC 9728
  OAuth protected-resource document at the path-suffixed well-known location
  /.well-known/oauth-protected-resource/mcp, which names
  https://github.com/login/oauth as its authorization server — and that
  authorization server publishes RFC 8414 metadata at the path-suffixed
  /.well-known/oauth-authorization-server/login/oauth. Both of those were
  missed by earlier rounds, which probed only the bare well-known paths.
  The bare paths 404 everywhere; the Actions OIDC provider
  (token.actions.githubusercontent.com) is a separate workload-identity
  surface reached from inside a workflow, not from the REST API host.
