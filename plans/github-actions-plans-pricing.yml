overage:
  minutes:
    unit: per minute
    currency: USD
    source: https://docs.github.com/en/billing/concepts/product-billing/github-actions
    rates:
      - {runner: Linux 1-core (x64), sku: actions_linux_slim, price: '0.002'}
      - {runner: Linux 2-core (x64), sku: actions_linux, price: '0.006'}
      - {runner: Linux 2-core (arm64), sku: actions_linux_arm, price: '0.005'}
      - {runner: Windows 2-core (x64), sku: actions_windows, price: '0.010'}
      - {runner: Windows 2-core (arm64), sku: actions_windows_arm, price: '0.010'}
      - {runner: macOS 3-core or 4-core (M1 or Intel), sku: actions_macos, price: '0.062'}
    note: Larger runners carry their own rates; see the Actions runner pricing page.
  storage:
    unit: per GB/month
    currency: USD
    rates:
      - {type: Shared storage (artifacts and GitHub Packages), price: '0.25'}
      - {type: Actions cache, price: '0.07'}
      - {type: Custom image storage, price: '0.07'}
    note: >-
      Storage accrues hourly in GB-Hours. Deleting an artifact stops future
      accrual but does not remove storage already accrued in the current cycle
      — the same one-way property recorded in the reversibility block of
      conventions/github-actions-conventions.yml.
free_use:
  - Public repositories using standard GitHub-hosted runners
  - Self-hosted runners (no minute charge; you supply the machine)
  - GitHub Pages builds
  - Dependabot
budget_controls:
  blocked_without_payment_method: true
  budgets: https://docs.github.com/en/billing/tutorials/set-up-budgets
  alerts: Email notification at 90% and 100% of included usage in a billing period
