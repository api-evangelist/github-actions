tags:
  - CI/CD
  - Metered Billing
  - Usage-Based
description: >-
  Published GitHub Actions plans and pricing, read from GitHub's own billing
  documentation and pricing page on 2026-09-17. REPLACES A SCAFFOLD: until this
  round this file carried invented placeholder tiers (a "Free" tier of 1,000
  API requests/month at 10 requests/minute, a "Professional" tier priced TBD)
  that GitHub has never published and that bear no relationship to how Actions
  is sold. Actions is not priced per API request at all — the REST API is free
  to call within the standard GitHub rate limits, and what is metered is
  COMPUTE (runner minutes) and STORAGE (artifacts, caches, custom images).
pricing_model: >-
  Included allowance per GitHub plan, then usage-based overage. Standard
  GitHub-hosted runners are free for public repositories, for GitHub Pages and
  for Dependabot; larger runners are always charged, even on public
  repositories. Minutes reset to the full allowance at the start of each
  billing cycle; storage accrues hourly in GB-Hours.
plan_count: 5
